[package]
name = "linux-passkey-dialog"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "GTK4 approval dialog (agent) for linux-passkey"

# Its own crate and lock file, so the daemon builds without GTK.
[workspace]

[dependencies]
gtk = { package = "gtk4", version = "0.11" }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
