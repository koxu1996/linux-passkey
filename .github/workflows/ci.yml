name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Builds against the pinned, patched OpenSK and runs the unit tests
      # (no TPM needed).
      - run: nix flake check -L
      - run: nix build -L .#default .#debug
